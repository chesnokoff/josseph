name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install mkdocs==1.6.1 mkdocs-material==9.7.6

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        run: mypy josseph

      - name: Build docs
        run: mkdocs build --strict

      - name: Build Docker image
        run: docker compose build josseph

      - name: Run tests
        run: pytest tests/ -v
