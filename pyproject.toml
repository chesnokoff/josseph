[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "josseph"
version = "1.1.0"
description = "Docker-first reproducible pipeline for extracting metrics from GitHub Java repositories"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.1",
    "pyarrow==23.0.1",
    "certifi==2026.1.4",
    "numpy==2.4.2",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
    "ruff==0.15.11",
    "mypy==1.19.0",
    "types-PyYAML==6.0.12.20260408",
]

# No [project.scripts]: the runtime expects configs/, third_party/, and
# logging.ini relative to the repo root.  Use `python -m josseph` from a
# source checkout or `docker compose run --rm josseph` (recommended).

[tool.setuptools.packages.find]
where = ["."]
include = ["josseph*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["BLE001"]

[tool.pytest.ini_options]
# The default run is unit-only: deterministic, no network, no external
# processes. Run the integration suite explicitly with `-m integration`
# (the command-line -m overrides this default).
addopts = "-m 'not integration'"
markers = [
    "integration: end-to-end pipeline integration tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
