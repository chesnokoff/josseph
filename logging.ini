[loggers]
keys=root,josseph

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=consoleFmt,fileFmt

[logger_root]
level=WARNING
handlers=consoleHandler

[logger_josseph]
level=TRACE
handlers=consoleHandler,fileHandler
qualname=josseph
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=consoleFmt
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=TRACE
formatter=fileFmt
args=('%(logfile)s','w','utf-8')

[formatter_consoleFmt]
format=%(levelname)s %(name)s: %(message)s

[formatter_fileFmt]
format=%(asctime)s %(levelname)s [%(process)d] [%(name)s] %(filename)s:%(lineno)d - %(message)s
datefmt=%Y-%m-%d %H:%M:%S
